# Railway: Docker image runs the Rust API (migrates Postgres on boot).
# Point DATABASE_URL at Supabase (Session pooler, port 5432, sslmode=require).
[build]
builder = "DOCKERFILE"
dockerfilePath = "Dockerfile"

[deploy]
healthcheckPath = "/v1/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
# Railway injects PORT; backend/src/main.rs binds 0.0.0.0:$PORT.
