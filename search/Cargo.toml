[package]
name = "search"
version = "0.1.0"
edition = "2021"

[dependencies]
glideapi = { path = "../glideapi" }
linkme   = "0.3"

# Crawling
reqwest  = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
scraper  = "0.20"
url      = "2"

# BM25 / full-text
tantivy  = "0.22"

# Storage (doc store)
sled     = "0.34"
bincode  = "1"

# Async / utils
tokio        = { version = "1", features = ["full"] }
serde        = { version = "1", features = ["derive"] }
serde_json   = "1"
anyhow       = "1"
tracing      = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid         = { version = "1", features = ["v4", "serde"] }
parking_lot  = "0.12"
