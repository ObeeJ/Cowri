name: Deploy

# Runs after every push to master. This assumes master is protected and
# requires the Backend and Build checks (backend.yml / web.yml) to pass
# before a merge lands there — that's a branch-protection setting, not
# something a workflow file can enforce on its own.
on:
  push:
    branches: ["master"]

env:
  IMAGE: ghcr.io/${{ github.repository }}-api

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_ref: ${{ steps.meta.outputs.image_ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set image ref
        id: meta
        run: echo "image_ref=${IMAGE}:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ steps.meta.outputs.image_ref }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment: production # requires DEPLOY_HOST/DEPLOY_SSH_KEY as environment secrets
    steps:
      - uses: actions/checkout@v4

      - name: Run pending migrations against Neon
        run: |
          curl -LsSf https://github.com/launchbadge/sqlx/releases/latest/download/sqlx-cli-x86_64-unknown-linux-gnu.tar.gz \
            | tar xz -C /usr/local/bin sqlx
          sqlx migrate run --source backend/migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Sync compose file and Caddyfile
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker-compose.prod.yml,Caddyfile"
          target: /opt/cowri
          strip_components: 0
          # .env is deliberately never synced from CI — it holds real
          # secrets and is created once, by hand, directly on the server.

      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: deploy
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: COWRI_IMAGE
          script: |
            cd /opt/cowri
            docker login ghcr.io -u ${{ github.actor }} -p ${{ secrets.GITHUB_TOKEN }}
            COWRI_IMAGE=${{ needs.build-and-push.outputs.image_ref }} docker compose -f docker-compose.prod.yml pull api
            COWRI_IMAGE=${{ needs.build-and-push.outputs.image_ref }} docker compose -f docker-compose.prod.yml up -d
            docker image prune -f

      - name: Verify health
        run: |
          for i in $(seq 1 10); do
            if curl -fsS "https://${{ secrets.API_DOMAIN }}/v1/health"; then exit 0; fi
            sleep 5
          done
          echo "API did not become healthy after deploy" >&2
          exit 1
